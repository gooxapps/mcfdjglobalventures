      (function () {
        try {
          var ownDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          var protoDesc =
            !ownDesc && typeof Window !== 'undefined'
              ? Object.getOwnPropertyDescriptor(Window.prototype, 'fetch')
              : null;
          var targetDesc = ownDesc || protoDesc;
          if (targetDesc && typeof targetDesc.get === 'function' && !targetDesc.set) {
            if (!ownDesc || ownDesc.configurable) {
              var origGetter = targetDesc.get;
              var customFetch = null;
              Object.defineProperty(window, 'fetch', {
                configurable: true,
                enumerable: targetDesc.enumerable !== false,
                get: function () {
                  return customFetch || origGetter.call(window);
                },
                set: function (fn) {
                  if (typeof fn === 'function') {
                    customFetch = fn;
                  }
                },
              });
            }

            var file = event && typeof event.filename === 'string' ? event.filename : '';

              file.indexOf('chrome-extension://') === 0 ||
              file.indexOf('moz-extension://') === 0
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
